<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Garden OS v1.7</title><style>body{font-family:-apple-system;background:#f4f5ef;color:#1d241f;margin:0}.app{max-width:540px;margin:auto;padding:24px 18px}.card{background:#fff;border:1px solid #dfe3dc;border-radius:24px;padding:20px;margin:14px 0}.today{background:#e8eee6}button{border:0;border-radius:18px;padding:15px;font-weight:700;font-size:15px}.primary{background:#61705f;color:#fff}.ghost{background:#fff;border:1px solid #dfe3dc}.row{display:flex;gap:10px}.row>*{flex:1}.photo{aspect-ratio:4/5;background:#e8eee6;border-radius:22px;display:grid;place-items:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}select,input{width:100%;padding:14px;border:1px solid #dfe3dc;border-radius:14px;font-size:16px;box-sizing:border-box;margin-top:9px}.muted{color:#6d766f}.label{font-size:12px;color:#6d766f;margin-top:14px}.bed,.plantcard{padding:14px 0;border-bottom:1px solid #dfe3dc}.memory{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #dfe3dc}.memory img{width:80px;height:80px;object-fit:cover;border-radius:14px}.name{font-weight:700}.small{font-size:12px;color:#6d766f;margin-top:3px}.tag{display:inline-block;font-size:11px;background:#e8eee6;padding:4px 7px;border-radius:9px;margin:5px 4px 0 0}.saved,.signal,.profile{margin-top:10px;padding:12px;border-radius:14px;background:#f4f5ef;font-size:13px;line-height:1.5}.saved{display:none;background:#e8eee6}.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.compare img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:16px}.compare figure{margin:0}.compare figcaption{font-size:11px;color:#6d766f;margin-top:5px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.big{font-size:28px;font-weight:750}</style></head><body><div class="app"><h2>Garden OS <small class="muted">v1.7</small></h2><section class="card today"><div class="small">GARDEN TODAY</div><h1 id="todayTitle">Your garden is beginning.</h1><div id="todayBody" class="muted"></div></section><section class="card"><h1>My garden,<br>over time.</h1><div id="beds"></div><input id="bedName" placeholder="花壇名"><button class="primary" style="width:100%;margin-top:10px" onclick="addBed()">＋ Add bed</button></section><section class="card"><h3>Plant Profile</h3><p class="muted">植物の基本情報を登録します。分からない項目は空欄でOKです。</p><input id="profileName" list="plantNames" placeholder="植物名 例：Hosta June"><datalist id="plantNames"></datalist><select id="profileBed"></select><div class="grid2"><input id="plantedDate" type="date"><select id="light"><option value="">Light unknown</option><option>Full sun</option><option>Part sun</option><option>Part shade</option><option>Shade</option></select><select id="water"><option value="">Water unknown</option><option>Dry</option><option>Average</option><option>Moist</option></select><select id="evergreen"><option value="">Season unknown</option><option>Evergreen</option><option>Semi-evergreen</option><option>Deciduous</option></select><input id="matureH" inputmode="numeric" placeholder="Mature height cm"><input id="matureW" inputmode="numeric" placeholder="Mature width cm"></div><button class="primary" style="width:100%;margin-top:10px" onclick="saveProfile()">Save plant profile</button><div id="profiles"></div></section><section class="card"><h3>Look</h3><select id="bedSelect"></select><div class="photo" style="margin-top:12px"><span id="prompt">Choose how to add a garden photo</span><img id="preview" style="display:none"></div><div class="row" style="margin-top:12px"><button class="primary" onclick="cameraInput.click()">📷 Take photo</button><button class="ghost" onclick="libraryInput.click()">🖼 Choose photo</button></div><input id="cameraInput" type="file" accept="image/*" capture="environment" hidden><input id="libraryInput" type="file" accept="image/*" hidden><div class="label">What did you do?</div><select id="action"><option value="">Observation only</option><option>Planted</option><option>Moved</option><option>Watered</option><option>Pruned</option><option>Fertilized</option><option>Removed</option><option>Other</option></select><input id="plant" list="plantNames" placeholder="Which plant?"><input id="change" placeholder="What changed?"><input id="note" placeholder="How does it feel?"><button class="primary" style="width:100%;margin-top:12px" onclick="savePhoto()">Save observation</button><div id="saveStatus" class="saved"></div></section><section class="card"><h3>Attention</h3><div id="attention"></div></section><section class="card"><h3>Then ↔ Now</h3><select id="compareBed" onchange="renderCompare()"></select><div id="comparison" class="muted"></div></section><section class="card"><h3>Recent memory</h3><div id="recent" class="muted"></div></section><section class="card"><h3>Garden Memory Backup</h3><div class="row"><button class="primary" onclick="exportBackup()">⬇ Backup</button><button class="ghost" onclick="restoreInput.click()">⬆ Restore</button></div><input id="restoreInput" type="file" accept="application/json,.json" hidden></section></div><script>const KEY='gardenOS_v10',DAY=86400000;let state;try{state=JSON.parse(localStorage.getItem(KEY)||'{"beds":[],"observations":[],"profiles":[]}')}catch(e){state={beds:[],observations:[],profiles:[]}}state.beds=state.beds||[];state.observations=state.observations||[];state.profiles=state.profiles||[];let photo=null;function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));render();return true}catch(e){alert('保存容量が足りません。');return false}}function bn(id){return(state.beds.find(b=>b.id===id)||{}).name||'Bed'}function addBed(){const n=bedName.value.trim();if(!n)return;state.beds.push({id:'b'+Date.now(),name:n});bedName.value='';persist()}function saveProfile(){const n=profileName.value.trim();if(!n)return alert('植物名を入力してください');const k=n.toLowerCase();let p=state.profiles.find(x=>x.name.toLowerCase()===k);const data={name:n,bedId:profileBed.value,plantedDate:plantedDate.value,light:light.value,water:water.value,evergreen:evergreen.value,matureH:matureH.value,matureW:matureW.value,updatedAt:Date.now()};if(p)Object.assign(p,data);else state.profiles.push({...data,id:'p'+Date.now()});profileName.value='';persist()}function renderProfiles(){profiles.innerHTML=state.profiles.length?state.profiles.map(p=>'<div class="profile"><div class="name">🌱 '+esc(p.name)+'</div><div class="small">'+esc(bn(p.bedId))+(p.plantedDate?' · planted '+esc(p.plantedDate):'')+'</div>'+(p.light?'<span class="tag">☀ '+esc(p.light)+'</span>':'')+(p.water?'<span class="tag">💧 '+esc(p.water)+'</span>':'')+(p.evergreen?'<span class="tag">'+esc(p.evergreen)+'</span>':'')+((p.matureH||p.matureW)?'<div class="small">Mature: '+esc(p.matureH||'?')+' × '+esc(p.matureW||'?')+' cm</div>':'')+'</div>').join(''):'<div class="muted">まだPlant Profileがありません。</div>'}function renderToday(){if(!state.observations.length){todayTitle.textContent='Your garden is beginning.';todayBody.textContent='最初の写真を1枚残すところから始めましょう。';return}const l=[...state.observations].sort((a,b)=>b.ts-a.ts)[0],d=Math.floor((Date.now()-l.ts)/DAY);todayTitle.textContent=d===0?'You looked at the garden today.':d+' days since your last look.';todayBody.innerHTML='<span class="big">'+state.observations.length+'</span> memories · '+state.beds.length+' beds · '+state.profiles.length+' profiles'}function renderAttention(){const s=[];state.beds.forEach(b=>{const a=state.observations.filter(o=>o.bedId===b.id).sort((x,y)=>y.ts-x.ts);if(!a.length)s.push('<div class="signal"><strong>'+esc(b.name)+'</strong><br>まだ最初の観察がありません。</div>');else{const d=Math.floor((Date.now()-a[0].ts)/DAY);if(d>=14)s.push('<div class="signal"><strong>'+esc(b.name)+'</strong><br>'+d+'日間、記録がありません。</div>')}});state.profiles.forEach(p=>{if(p.matureW){const w=Number(p.matureW);if(w>=80)s.push('<div class="signal"><strong>'+esc(p.name)+'</strong><br>成熟幅 '+w+'cm。周囲のFuture Spaceを意識しておく価値があります。</div>')}});attention.innerHTML=s.length?s.join(''):'今のところ大きな注意点はありません。'}function renderCompare(){const a=state.observations.filter(o=>o.bedId===compareBed.value).sort((x,y)=>x.ts-y.ts);if(a.length<2){comparison.innerHTML='2枚以上の記録ができると比較できます。';return}const f=a[0],l=a[a.length-1],d=Math.round((l.ts-f.ts)/DAY);comparison.innerHTML='<div class="compare"><figure><img src="'+f.photo+'"><figcaption>THEN · '+new Date(f.ts).toLocaleDateString()+'</figcaption></figure><figure><img src="'+l.photo+'"><figcaption>NOW · '+new Date(l.ts).toLocaleDateString()+'</figcaption></figure></div><div class="signal"><strong>'+d+' days of change</strong>'+(l.change?'<br>'+esc(l.change):'')+'</div>'}function render(){beds.innerHTML=state.beds.map(b=>'<div class="bed">'+esc(b.name)+'</div>').join('');const opts=state.beds.map(b=>'<option value="'+b.id+'">'+esc(b.name)+'</option>').join('');const cur=bedSelect.value,cc=compareBed.value;bedSelect.innerHTML=opts;profileBed.innerHTML=opts;compareBed.innerHTML=opts;if(state.beds.some(b=>b.id===cur))bedSelect.value=cur;if(state.beds.some(b=>b.id===cc))compareBed.value=cc;const names=[...new Set([...state.profiles.map(p=>p.name),...state.observations.map(o=>o.plant).filter(Boolean)])];plantNames.innerHTML=names.map(n=>'<option value="'+esc(n)+'"></option>').join('');renderProfiles();renderToday();renderAttention();renderCompare();const items=state.observations.slice(-8).reverse();recent.innerHTML=items.length?items.map(o=>'<div class="memory"><img src="'+o.photo+'"><div><div class="name">'+esc(bn(o.bedId))+'</div><div class="small">'+new Date(o.ts).toLocaleString()+'</div>'+(o.plant?'<span class="tag">🌱 '+esc(o.plant)+'</span>':'')+(o.action?'<span class="tag">'+esc(o.action)+'</span>':'')+(o.change?'<div class="small">'+esc(o.change)+'</div>':'')+'</div></div>').join(''):'まだ写真がありません。'}async function compress(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const m=1280,s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};i.src=r.result};r.readAsDataURL(file)})}async function choose(e){const f=e.target.files[0];if(!f)return;photo=await compress(f);preview.src=photo;preview.style.display='block';prompt.style.display='none'}cameraInput.addEventListener('change',choose);libraryInput.addEventListener('change',choose);function savePhoto(){if(!bedSelect.value)return alert('先に花壇を登録してください');if(!photo)return alert('写真を追加してください');const o={id:'o'+Date.now(),bedId:bedSelect.value,photo,ts:Date.now(),action:action.value,plant:plant.value.trim(),change:change.value.trim(),note:note.value.trim()};state.observations.push(o);if(!persist()){state.observations.pop();return}photo=null;preview.style.display='none';prompt.style.display='block';action.value='';plant.value='';change.value='';note.value='';saveStatus.textContent='✓ Garden memory saved';saveStatus.style.display='block'}function exportBackup(){const b=new Blob([JSON.stringify({format:'GardenOSBackup',version:'1.7',createdAt:new Date().toISOString(),data:state})],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='garden-os-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}restoreInput.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(x.format!=='GardenOSBackup')throw 0;if(confirm('現在のデータを置き換えますか？')){state=x.data;state.profiles=state.profiles||[];persist()}}catch(_){alert('読み込めないバックアップです。')}};r.readAsText(f)});render()</script></body></html>

<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Garden OS v1.2</title><style>body{font-family:-apple-system;background:#f4f5ef;color:#1d241f;margin:0}.app{max-width:540px;margin:auto;padding:24px 18px}.card{background:white;border:1px solid #dfe3dc;border-radius:24px;padding:20px;margin:14px 0}button{border:0;border-radius:18px;padding:16px;font-weight:700;font-size:16px}.primary{background:#61705f;color:white}.ghost{background:white;border:1px solid #dfe3dc}.row{display:flex;gap:10px}.row>*{flex:1}.photo{aspect-ratio:4/5;background:#e8eee6;border-radius:22px;display:grid;place-items:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}select,input{width:100%;padding:14px;border:1px solid #dfe3dc;border-radius:14px;font-size:16px;box-sizing:border-box}.muted{color:#6d766f}.bed{padding:18px 0;border-bottom:1px solid #dfe3dc;font-weight:700}.status{font-size:13px;color:#6d766f;margin-top:8px;line-height:1.4}.memory{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #dfe3dc}.memory:last-child{border-bottom:0}.memory img{width:76px;height:76px;object-fit:cover;border-radius:14px;background:#e8eee6}.memory .meta{min-width:0}.memory .name{font-weight:700}.memory .small{font-size:12px;color:#6d766f;margin-top:3px}.memory .note{font-size:13px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.saved{margin-top:10px;padding:12px 14px;border-radius:14px;background:#e8eee6;font-size:14px;display:none}</style></head><body><div class="app"><h2>Garden OS <small class="muted">v1.2</small></h2><section class="card"><h1>My garden,<br>over time.</h1><p class="muted">写真を残すほど、庭の変化と成長が見えてきます。</p><div id="beds"></div><input id="bedName" placeholder="花壇名"><button class="primary" style="width:100%;margin-top:10px" onclick="addBed()">＋ Add bed</button></section><section class="card"><h3>Look</h3><select id="bedSelect"></select><div class="photo" style="margin-top:12px"><span id="prompt">Choose how to add a garden photo</span><img id="preview" style="display:none"></div><div class="row" style="margin-top:12px"><button class="primary" onclick="cameraInput.click()">📷 Take photo</button><button class="ghost" onclick="libraryInput.click()">🖼 Choose photo</button></div><input id="cameraInput" type="file" accept="image/*" capture="environment" hidden><input id="libraryInput" type="file" accept="image/*" hidden><input id="note" placeholder="How does it feel? 例：少し寂しい" style="margin-top:12px"><button class="primary" style="width:100%;margin-top:10px" onclick="savePhoto()">Save observation</button><div id="saveStatus" class="saved"></div></section><section class="card"><h3>Recent memory</h3><div id="recent" class="muted">まだ写真がありません。</div></section><section class="card"><h3>Garden Memory Backup</h3><p class="muted">花壇・写真・日時・メモを1つのバックアップファイルに保存します。</p><div class="row"><button class="primary" onclick="exportBackup()">⬇ Backup</button><button class="ghost" onclick="restoreInput.click()">⬆ Restore</button></div><input id="restoreInput" type="file" accept="application/json,.json" hidden><div id="backupStatus" class="status">まだバックアップしていません。</div></section></div><script>const KEY='gardenOS_v10';let state;try{state=JSON.parse(localStorage.getItem(KEY)||'{"beds":[],"observations":[]}')}catch(e){state={beds:[],observations:[]}}state.beds=state.beds||[];state.observations=state.observations||[];let photo=null;function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));render();return true}catch(e){alert('保存容量が足りません。写真をさらに小さくして再保存してください。');return false}}function addBed(){let n=bedName.value.trim();if(!n)return;state.beds.push({id:'b'+Date.now(),name:n});bedName.value='';persist()}function bedNameFor(id){return(state.beds.find(b=>b.id===id)||{}).name||'Bed'}function render(){beds.innerHTML=state.beds.map(b=>'<div class="bed">'+escapeHtml(b.name)+'</div>').join('');const current=bedSelect.value;bedSelect.innerHTML=state.beds.map(b=>'<option value="'+b.id+'">'+escapeHtml(b.name)+'</option>').join('');if(state.beds.some(b=>b.id===current))bedSelect.value=current;const items=state.observations.slice(-5).reverse();recent.className=items.length?'':'muted';recent.innerHTML=items.length?items.map(o=>'<div class="memory"><img src="'+o.photo+'"><div class="meta"><div class="name">'+escapeHtml(bedNameFor(o.bedId))+'</div><div class="small">'+new Date(o.ts).toLocaleString()+'</div>'+(o.note?'<div class="note">'+escapeHtml(o.note)+'</div>':'')+'</div></div>').join(''):'まだ写真がありません。'}async function compressImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1280,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*scale),h=Math.round(img.height*scale),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',0.72))};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}async function choose(e){let f=e.target.files[0];if(!f)return;prompt.textContent='Preparing photo…';try{photo=await compressImage(f);preview.src=photo;preview.style.display='block';prompt.style.display='none';saveStatus.style.display='none'}catch(err){alert('写真を読み込めませんでした。')}}cameraInput.addEventListener('change',choose);libraryInput.addEventListener('change',choose);function savePhoto(){if(!bedSelect.value){alert('先に花壇を登録してください');return}if(!photo){alert('写真を追加してください');return}const item={id:'o'+Date.now(),bedId:bedSelect.value,photo,ts:Date.now(),note:note.value.trim()};state.observations.push(item);if(!persist()){state.observations.pop();return}photo=null;preview.style.display='none';prompt.style.display='block';prompt.textContent='Choose how to add a garden photo';note.value='';cameraInput.value='';libraryInput.value='';saveStatus.textContent='✓ Saved to Recent memory';saveStatus.style.display='block';recent.scrollIntoView({behavior:'smooth',block:'center'})}function exportBackup(){const payload={format:'GardenOSBackup',version:'1.2',createdAt:new Date().toISOString(),data:state};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a'),d=new Date(),stamp=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');a.href=url;a.download='garden-os-backup-'+stamp+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);backupStatus.textContent='Backup created: '+new Date().toLocaleString()}restoreInput.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);if(!obj||obj.format!=='GardenOSBackup'||!obj.data||!Array.isArray(obj.data.beds)||!Array.isArray(obj.data.observations))throw new Error('invalid');if(!confirm('現在のGarden OSデータを、このバックアップ内容で置き換えますか？'))return;state=obj.data;persist();backupStatus.textContent='Restored: '+new Date().toLocaleString();alert('復元しました。')}catch(err){alert('Garden OSのバックアップファイルとして読み込めませんでした。')}finally{restoreInput.value=''}};r.readAsText(f)});function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}render()</script></body></html>

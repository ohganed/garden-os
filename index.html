<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Garden OS v1.6</title><style>body{font-family:-apple-system;background:#f4f5ef;color:#1d241f;margin:0}.app{max-width:540px;margin:auto;padding:24px 18px}.card{background:#fff;border:1px solid #dfe3dc;border-radius:24px;padding:20px;margin:14px 0}button{border:0;border-radius:18px;padding:15px;font-weight:700;font-size:15px}.primary{background:#61705f;color:#fff}.ghost{background:#fff;border:1px solid #dfe3dc}.row{display:flex;gap:10px}.row>*{flex:1}.photo{aspect-ratio:4/5;background:#e8eee6;border-radius:22px;display:grid;place-items:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}select,input{width:100%;padding:14px;border:1px solid #dfe3dc;border-radius:14px;font-size:16px;box-sizing:border-box;margin-top:9px}.muted{color:#6d766f}.bed{padding:16px 0;border-bottom:1px solid #dfe3dc;font-weight:700}.memory{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #dfe3dc}.memory img{width:84px;height:84px;object-fit:cover;border-radius:14px}.name{font-weight:700}.small{font-size:12px;color:#6d766f;margin-top:3px}.tag{display:inline-block;font-size:11px;background:#e8eee6;padding:4px 7px;border-radius:9px;margin:5px 4px 0 0}.saved{margin-top:10px;padding:12px;border-radius:14px;background:#e8eee6;display:none}.label{font-size:12px;color:#6d766f;margin-top:14px}.plantcard{padding:14px 0;border-bottom:1px solid #dfe3dc}.planthead{display:flex;justify-content:space-between;gap:8px}.count{font-size:12px;background:#e8eee6;border-radius:10px;padding:5px 8px}.timeline{margin-top:8px;padding-left:12px;border-left:2px solid #dfe3dc}.event{font-size:12px;margin:8px 0;color:#56605a}.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.compare figure{margin:0}.compare img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:16px}.compare figcaption{font-size:11px;color:#6d766f;margin-top:5px}.delta,.signal{margin-top:12px;padding:12px;background:#f4f5ef;border-radius:14px;font-size:13px;line-height:1.5}.today{background:#e8eee6}.today h1{margin-bottom:6px}.big{font-size:30px;font-weight:750}.signal strong{display:block;margin-bottom:3px}</style></head><body><div class="app"><h2>Garden OS <small class="muted">v1.6</small></h2><section class="card today"><div class="small">GARDEN TODAY</div><h1 id="todayTitle">Your garden is beginning.</h1><div id="todayBody" class="muted"></div></section><section class="card"><h1>My garden,<br>over time.</h1><div id="beds"></div><input id="bedName" placeholder="花壇名"><button class="primary" style="width:100%;margin-top:10px" onclick="addBed()">＋ Add bed</button></section><section class="card"><h3>Look</h3><div class="label">Where?</div><select id="bedSelect"></select><div class="photo" style="margin-top:12px"><span id="prompt">Choose how to add a garden photo</span><img id="preview" style="display:none"></div><div class="row" style="margin-top:12px"><button class="primary" onclick="cameraInput.click()">📷 Take photo</button><button class="ghost" onclick="libraryInput.click()">🖼 Choose photo</button></div><input id="cameraInput" type="file" accept="image/*" capture="environment" hidden><input id="libraryInput" type="file" accept="image/*" hidden><div class="label">What did you do?</div><select id="action"><option value="">Nothing / observation only</option><option>Planted</option><option>Moved</option><option>Watered</option><option>Pruned</option><option>Fertilized</option><option>Removed</option><option>Other</option></select><div class="label">Which plant?</div><input id="plant" list="plantNames" placeholder="例：Hosta June / ヒューケラ"><datalist id="plantNames"></datalist><div class="label">What changed?</div><input id="change" placeholder="例：新葉が出た・少し広がった"><div class="label">How does it feel?</div><input id="note" placeholder="例：少し寂しい / バランスが良くなった"><button class="primary" style="width:100%;margin-top:12px" onclick="savePhoto()">Save observation</button><div id="saveStatus" class="saved"></div></section><section class="card"><h3>Attention</h3><p class="muted">記録が途切れた花壇や植物を、静かに知らせます。</p><div id="attention"></div></section><section class="card"><h3>Then ↔ Now</h3><select id="compareBed" onchange="renderCompare()"></select><div id="comparison" class="muted" style="margin-top:12px"></div></section><section class="card"><h3>Plant memory</h3><div id="plants" class="muted"></div></section><section class="card"><h3>Recent memory</h3><div id="recent" class="muted"></div></section><section class="card"><h3>Garden Memory Backup</h3><div class="row"><button class="primary" onclick="exportBackup()">⬇ Backup</button><button class="ghost" onclick="restoreInput.click()">⬆ Restore</button></div><input id="restoreInput" type="file" accept="application/json,.json" hidden></section></div><script>const KEY='gardenOS_v10';let state;try{state=JSON.parse(localStorage.getItem(KEY)||'{"beds":[],"observations":[]}')}catch(e){state={beds:[],observations:[]}}state.beds=state.beds||[];state.observations=state.observations||[];let photo=null;const DAY=86400000;function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));render();return true}catch(e){alert('保存容量が足りません。');return false}}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function addBed(){const n=bedName.value.trim();if(!n)return;state.beds.push({id:'b'+Date.now(),name:n});bedName.value='';persist()}function bn(id){return(state.beds.find(b=>b.id===id)||{}).name||'Bed'}function plantGroups(){const g={};state.observations.filter(o=>o.plant&&o.plant.trim()).forEach(o=>{const k=o.plant.trim().toLowerCase();if(!g[k])g[k]={name:o.plant.trim(),items:[]};g[k].items.push(o)});return Object.values(g)}function renderToday(){if(!state.observations.length){todayTitle.textContent='Your garden is beginning.';todayBody.textContent='最初の写真を1枚残すところから始めましょう。';return}const latest=state.observations.slice().sort((a,b)=>b.ts-a.ts)[0],days=Math.floor((Date.now()-latest.ts)/DAY),plantsN=plantGroups().length;todayTitle.textContent=days===0?'You looked at the garden today.':days===1?'You looked at the garden yesterday.':days+' days since your last look.';todayBody.innerHTML='<span class="big">'+state.observations.length+'</span> memories · '+state.beds.length+' beds · '+plantsN+' plants'+(latest.change?'<br>Latest change: '+esc(latest.change):'')}function renderAttention(){const signals=[];state.beds.forEach(b=>{const a=state.observations.filter(o=>o.bedId===b.id).sort((x,y)=>y.ts-x.ts);if(!a.length)signals.push('<div class="signal"><strong>'+esc(b.name)+'</strong>まだ最初の観察がありません。</div>');else{const d=Math.floor((Date.now()-a[0].ts)/DAY);if(d>=14)signals.push('<div class="signal"><strong>'+esc(b.name)+'</strong>'+d+'日間、記録がありません。そろそろ同じ場所から見てみてもよさそうです。</div>')}});attention.innerHTML=signals.length?signals.join(''):'今のところ、特に気になる記録の空白はありません。'}function renderCompare(){const id=compareBed.value,a=state.observations.filter(o=>o.bedId===id).sort((x,y)=>x.ts-y.ts);if(a.length<2){comparison.innerHTML='2枚以上の記録ができると比較できます。';return}const f=a[0],l=a[a.length-1],d=Math.round((l.ts-f.ts)/DAY);comparison.innerHTML='<div class="compare"><figure><img src="'+f.photo+'"><figcaption>THEN · '+new Date(f.ts).toLocaleDateString()+'</figcaption></figure><figure><img src="'+l.photo+'"><figcaption>NOW · '+new Date(l.ts).toLocaleDateString()+'</figcaption></figure></div><div class="delta"><strong>'+d+' days of change</strong>'+(l.change?'<br>'+esc(l.change):'')+'</div>'}function render(){beds.innerHTML=state.beds.map(b=>'<div class="bed">'+esc(b.name)+'</div>').join('');const cur=bedSelect.value,cc=compareBed.value,opts=state.beds.map(b=>'<option value="'+b.id+'">'+esc(b.name)+'</option>').join('');bedSelect.innerHTML=opts;compareBed.innerHTML=opts;if(state.beds.some(b=>b.id===cur))bedSelect.value=cur;if(state.beds.some(b=>b.id===cc))compareBed.value=cc;const groups=plantGroups();plantNames.innerHTML=groups.map(g=>'<option value="'+esc(g.name)+'"></option>').join('');plants.innerHTML=groups.length?groups.map(g=>{const a=g.items.sort((x,y)=>x.ts-y.ts);return '<div class="plantcard"><div class="planthead"><div class="name">🌱 '+esc(g.name)+'</div><span class="count">'+a.length+' memories</span></div><div class="timeline">'+a.slice(-4).map(o=>'<div class="event">'+new Date(o.ts).toLocaleDateString()+(o.action?' · '+esc(o.action):'')+(o.change?' — '+esc(o.change):'')+'</div>').join('')+'</div></div>'}).join(''):'植物名を記録すると、ここに育ち方が見えてきます。';const items=state.observations.slice(-8).reverse();recent.innerHTML=items.length?items.map(o=>'<div class="memory"><img src="'+o.photo+'"><div><div class="name">'+esc(bn(o.bedId))+'</div><div class="small">'+new Date(o.ts).toLocaleString()+'</div>'+(o.plant?'<span class="tag">🌱 '+esc(o.plant)+'</span>':'')+(o.action?'<span class="tag">'+esc(o.action)+'</span>':'')+(o.change?'<div class="small">'+esc(o.change)+'</div>':'')+'</div></div>').join(''):'まだ写真がありません。';renderToday();renderAttention();renderCompare()}async function compress(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const m=1280,s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};i.src=r.result};r.readAsDataURL(file)})}async function choose(e){const f=e.target.files[0];if(!f)return;photo=await compress(f);preview.src=photo;preview.style.display='block';prompt.style.display='none'}cameraInput.addEventListener('change',choose);libraryInput.addEventListener('change',choose);function savePhoto(){if(!bedSelect.value)return alert('先に花壇を登録してください');if(!photo)return alert('写真を追加してください');const o={id:'o'+Date.now(),bedId:bedSelect.value,photo,ts:Date.now(),action:action.value,plant:plant.value.trim(),change:change.value.trim(),note:note.value.trim()};state.observations.push(o);if(!persist()){state.observations.pop();return}photo=null;preview.style.display='none';prompt.style.display='block';action.value='';plant.value='';change.value='';note.value='';saveStatus.textContent='✓ Garden memory saved';saveStatus.style.display='block'}function exportBackup(){const b=new Blob([JSON.stringify({format:'GardenOSBackup',version:'1.6',createdAt:new Date().toISOString(),data:state})],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='garden-os-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}restoreInput.addEventListener('change',e=>{const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(x.format!=='GardenOSBackup')throw 0;if(confirm('現在のデータを置き換えますか？')){state=x.data;persist()}}catch(_){alert('読み込めないバックアップです。')}};if(e.target.files[0])r.readAsText(e.target.files[0])});render()</script></body></html>

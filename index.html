<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Garden OS v1.9</title><style>body{font-family:-apple-system;background:#f4f5ef;color:#1d241f;margin:0}.app{max-width:540px;margin:auto;padding:24px 18px}.card{background:#fff;border:1px solid #dfe3dc;border-radius:24px;padding:20px;margin:14px 0}.today{background:#e8eee6}button{border:0;border-radius:18px;padding:14px;font-weight:700;font-size:15px}.primary{background:#61705f;color:#fff}.ghost{background:#fff;border:1px solid #dfe3dc}.row{display:flex;gap:9px}.row>*{flex:1}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}select,input{width:100%;padding:13px;border:1px solid #dfe3dc;border-radius:14px;font-size:16px;box-sizing:border-box;margin-top:8px}.muted,.small{color:#6d766f}.small{font-size:12px}.name{font-weight:700}.bed,.profile{padding:13px 0;border-bottom:1px solid #dfe3dc}.tag{display:inline-block;font-size:11px;background:#e8eee6;padding:4px 7px;border-radius:9px;margin:5px 4px 0 0}.signal,.saved{margin-top:10px;padding:12px;border-radius:14px;background:#f4f5ef;font-size:13px;line-height:1.5}.saved{display:none;background:#e8eee6}.fit-good{background:#edf3ea}.fit-watch{background:#fff4df}.photo{aspect-ratio:4/5;background:#e8eee6;border-radius:22px;display:grid;place-items:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.memory{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid #dfe3dc}.memory img{width:76px;height:76px;object-fit:cover;border-radius:13px}.mapwrap{margin-top:12px}.map{position:relative;width:100%;height:300px;border:2px solid #9da99d;border-radius:18px;background:linear-gradient(90deg,rgba(97,112,95,.07) 1px,transparent 1px),linear-gradient(rgba(97,112,95,.07) 1px,transparent 1px),#eef2e9;background-size:10% 10%;overflow:hidden;touch-action:none}.plantdot{position:absolute;transform:translate(-50%,-50%);border:2px solid #61705f;background:rgba(255,255,255,.72);border-radius:50%;display:grid;place-items:center;text-align:center;font-size:10px;font-weight:700;line-height:1.05;padding:2px;box-sizing:border-box;min-width:38px;min-height:38px}.mapnote{font-size:12px;color:#6d766f;margin-top:8px}</style></head><body><div class="app"><h2>Garden OS <small class="muted">v1.9</small></h2><section class="card today"><div class="small">GARDEN TODAY</div><h1 id="todayTitle">Your garden is beginning.</h1><div id="todayBody" class="muted"></div></section><section class="card"><h1>My garden,<br>over time.</h1><div id="beds"></div><input id="bedName" placeholder="花壇名"><button class="primary" style="width:100%;margin-top:9px" onclick="addBed()">＋ Add bed</button></section><section class="card"><h3>Bed Profile</h3><select id="bedProfileSelect"></select><div class="grid2"><select id="orientation"><option value="">Direction unknown</option><option>North</option><option>Northeast</option><option>East</option><option>Southeast</option><option>South</option><option>Southwest</option><option>West</option><option>Northwest</option></select><select id="bedLight"><option value="">Light unknown</option><option>Full sun</option><option>Part sun</option><option>Part shade</option><option>Shade</option></select><select id="soil"><option value="">Soil unknown</option><option>Well-drained</option><option>Average</option><option>Moisture-retentive</option><option>Heavy / clay</option></select><select id="bedWater"><option value="">Moisture unknown</option><option>Dry</option><option>Average</option><option>Moist</option></select><input id="bedW" inputmode="numeric" placeholder="Width cm"><input id="bedD" inputmode="numeric" placeholder="Depth cm"></div><button class="primary" style="width:100%;margin-top:9px" onclick="saveBedProfile()">Save bed profile</button><div id="bedProfiles"></div></section><section class="card"><h3>Plant Profile</h3><input id="profileName" list="plantNames" placeholder="植物名 例：Hosta June"><datalist id="plantNames"></datalist><select id="profileBed"></select><div class="grid2"><input id="plantedDate" type="date"><select id="light"><option value="">Light unknown</option><option>Full sun</option><option>Part sun</option><option>Part shade</option><option>Shade</option></select><select id="water"><option value="">Water unknown</option><option>Dry</option><option>Average</option><option>Moist</option></select><select id="evergreen"><option value="">Season unknown</option><option>Evergreen</option><option>Semi-evergreen</option><option>Deciduous</option></select><input id="matureH" inputmode="numeric" placeholder="Mature height cm"><input id="matureW" inputmode="numeric" placeholder="Mature width cm"></div><button class="primary" style="width:100%;margin-top:9px" onclick="saveProfile()">Save plant profile</button><div id="profiles"></div></section><section class="card"><h3>Garden Map</h3><p class="muted">植物を選び、花壇の位置をタップ。円は成熟時のおおよその広がりです。</p><select id="mapBed" onchange="renderMap()"></select><select id="mapPlant"></select><div class="mapwrap"><div id="gardenMap" class="map" onclick="placePlant(event)"></div><div id="mapScale" class="mapnote"></div></div><button class="ghost" style="width:100%;margin-top:9px" onclick="clearLastMapPlant()">Undo last placement</button></section><section class="card"><h3>Plant × Place Fit</h3><div id="fit"></div></section><section class="card"><h3>Look</h3><select id="bedSelect"></select><div class="photo" style="margin-top:10px"><span id="prompt">Choose how to add a garden photo</span><img id="preview" style="display:none"></div><div class="row" style="margin-top:10px"><button class="primary" onclick="cameraInput.click()">📷 Take photo</button><button class="ghost" onclick="libraryInput.click()">🖼 Choose photo</button></div><input id="cameraInput" type="file" accept="image/*" capture="environment" hidden><input id="libraryInput" type="file" accept="image/*" hidden><select id="action"><option value="">Observation only</option><option>Planted</option><option>Moved</option><option>Watered</option><option>Pruned</option><option>Fertilized</option><option>Removed</option><option>Other</option></select><input id="plant" list="plantNames" placeholder="Which plant?"><input id="change" placeholder="What changed?"><input id="note" placeholder="How does it feel?"><button class="primary" style="width:100%;margin-top:10px" onclick="savePhoto()">Save observation</button><div id="saveStatus" class="saved"></div></section><section class="card"><h3>Attention</h3><div id="attention"></div></section><section class="card"><h3>Recent memory</h3><div id="recent"></div></section><section class="card"><h3>Garden Memory Backup</h3><div class="row"><button class="primary" onclick="exportBackup()">⬇ Backup</button><button class="ghost" onclick="restoreInput.click()">⬆ Restore</button></div><input id="restoreInput" type="file" accept="application/json,.json" hidden></section></div><script>const KEY='gardenOS_v10',DAY=86400000;let state;try{state=JSON.parse(localStorage.getItem(KEY)||'{"beds":[],"observations":[],"profiles":[],"bedProfiles":[],"mapPlants":[]}')}catch(e){state={beds:[],observations:[],profiles:[],bedProfiles:[],mapPlants:[]}};['beds','observations','profiles','bedProfiles','mapPlants'].forEach(k=>state[k]=state[k]||[]);let photo=null;function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));render();return true}catch(e){alert('保存容量が足りません。');return false}}function bn(id){return(state.beds.find(b=>b.id===id)||{}).name||'Bed'}function addBed(){const n=bedName.value.trim();if(!n)return;state.beds.push({id:'b'+Date.now(),name:n});bedName.value='';persist()}function saveBedProfile(){if(!bedProfileSelect.value)return;let p=state.bedProfiles.find(x=>x.bedId===bedProfileSelect.value);const d={bedId:bedProfileSelect.value,orientation:orientation.value,light:bedLight.value,soil:soil.value,water:bedWater.value,width:bedW.value,depth:bedD.value};if(p)Object.assign(p,d);else state.bedProfiles.push({...d,id:'bp'+Date.now()});persist()}function saveProfile(){const n=profileName.value.trim();if(!n)return alert('植物名を入力してください');let p=state.profiles.find(x=>x.name.toLowerCase()===n.toLowerCase());const d={name:n,bedId:profileBed.value,plantedDate:plantedDate.value,light:light.value,water:water.value,evergreen:evergreen.value,matureH:matureH.value,matureW:matureW.value};if(p)Object.assign(p,d);else state.profiles.push({...d,id:'p'+Date.now()});profileName.value='';persist()}function placePlant(e){const p=state.profiles.find(x=>x.id===mapPlant.value);if(!p)return alert('先にPlant Profileを登録してください');const r=gardenMap.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;state.mapPlants.push({id:'mp'+Date.now(),bedId:mapBed.value,profileId:p.id,x,y,ts:Date.now()});persist()}function clearLastMapPlant(){for(let i=state.mapPlants.length-1;i>=0;i--){if(state.mapPlants[i].bedId===mapBed.value){state.mapPlants.splice(i,1);persist();break}}}function renderMap(){const id=mapBed.value,bp=state.bedProfiles.find(x=>x.bedId===id),items=state.mapPlants.filter(x=>x.bedId===id);gardenMap.innerHTML=items.map(m=>{const p=state.profiles.find(x=>x.id===m.profileId);if(!p)return'';let size=46;if(bp&&Number(bp.width)&&Number(p.matureW))size=Math.max(38,Math.min(180,300*Number(p.matureW)/Number(bp.width)));return '<div class="plantdot" style="left:'+(m.x*100)+'%;top:'+(m.y*100)+'%;width:'+size+'px;height:'+size+'px">'+esc(p.name)+'</div>'}).join('');mapScale.textContent=bp&&bp.width&&bp.depth?'Bed size: '+bp.width+' × '+bp.depth+' cm · circles scaled approximately to mature width':'Bed Profileにサイズを入れると、成熟幅を縮尺表示できます。'}function renderFit(){const rows=[];state.profiles.forEach(p=>{const b=state.bedProfiles.find(x=>x.bedId===p.bedId);if(!b)return;const issues=[];if(p.light&&b.light&&p.light!==b.light)issues.push('Light '+p.light+' / '+b.light);if(p.water&&b.water&&p.water!==b.water)issues.push('Water '+p.water+' / '+b.water);rows.push('<div class="signal '+(issues.length?'fit-watch':'fit-good')+'"><strong>'+esc(p.name)+' × '+esc(bn(p.bedId))+'</strong><br>'+(issues.length?'Check: '+issues.map(esc).join(' · '):'Known conditions broadly compatible.')+'</div>')});fit.innerHTML=rows.length?rows.join(''):'Plant ProfileとBed Profileを登録すると照合できます。'}function render(){const opts=state.beds.map(b=>'<option value="'+b.id+'">'+esc(b.name)+'</option>').join('');beds.innerHTML=state.beds.map(b=>'<div class="bed">'+esc(b.name)+'</div>').join('');[bedProfileSelect,profileBed,mapBed,bedSelect].forEach(x=>x.innerHTML=opts);mapPlant.innerHTML=state.profiles.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('');plantNames.innerHTML=[...new Set(state.profiles.map(p=>p.name))].map(n=>'<option value="'+esc(n)+'"></option>').join('');bedProfiles.innerHTML=state.bedProfiles.map(p=>'<div class="profile"><div class="name">'+esc(bn(p.bedId))+'</div><span class="tag">'+esc(p.orientation||'Direction ?')+'</span><span class="tag">☀ '+esc(p.light||'?')+'</span><span class="tag">💧 '+esc(p.water||'?')+'</span><div class="small">'+esc(p.width||'?')+' × '+esc(p.depth||'?')+' cm</div></div>').join('');profiles.innerHTML=state.profiles.map(p=>'<div class="profile"><div class="name">🌱 '+esc(p.name)+'</div><div class="small">'+esc(bn(p.bedId))+' · mature '+esc(p.matureH||'?')+' × '+esc(p.matureW||'?')+' cm</div></div>').join('');renderFit();renderMap();const latest=state.observations.slice().sort((a,b)=>b.ts-a.ts)[0];todayTitle.textContent=latest?'You looked at the garden '+(Math.floor((Date.now()-latest.ts)/DAY)||'today')+(Math.floor((Date.now()-latest.ts)/DAY)?' days ago.':''):'Your garden is beginning.';todayBody.textContent=state.observations.length+' memories · '+state.beds.length+' beds · '+state.profiles.length+' plants';attention.innerHTML=state.beds.filter(b=>!state.observations.some(o=>o.bedId===b.id)).map(b=>'<div class="signal"><strong>'+esc(b.name)+'</strong><br>まだ最初の観察がありません。</div>').join('')||'今のところ大きな注意点はありません。';recent.innerHTML=state.observations.slice(-8).reverse().map(o=>'<div class="memory"><img src="'+o.photo+'"><div><div class="name">'+esc(bn(o.bedId))+'</div><div class="small">'+new Date(o.ts).toLocaleString()+'</div>'+(o.plant?'<span class="tag">🌱 '+esc(o.plant)+'</span>':'')+'</div></div>').join('')||'まだ写真がありません。'}async function compress(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};i.src=r.result};r.readAsDataURL(f)})}async function choose(e){if(!e.target.files[0])return;photo=await compress(e.target.files[0]);preview.src=photo;preview.style.display='block';prompt.style.display='none'}cameraInput.addEventListener('change',choose);libraryInput.addEventListener('change',choose);function savePhoto(){if(!bedSelect.value||!photo)return alert('花壇と写真を選んでください');state.observations.push({id:'o'+Date.now(),bedId:bedSelect.value,photo,ts:Date.now(),action:action.value,plant:plant.value.trim(),change:change.value.trim(),note:note.value.trim()});if(persist()){photo=null;preview.style.display='none';prompt.style.display='block';saveStatus.textContent='✓ Garden memory saved';saveStatus.style.display='block'}}function exportBackup(){const b=new Blob([JSON.stringify({format:'GardenOSBackup',version:'1.9',data:state})],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='garden-os-backup.json';a.click()}restoreInput.addEventListener('change',e=>{const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(x.format!=='GardenOSBackup')throw 0;if(confirm('現在のデータを置き換えますか？')){state=x.data;state.mapPlants=state.mapPlants||[];persist()}}catch(_){alert('読み込めないバックアップです。')}};if(e.target.files[0])r.readAsText(e.target.files[0])});render()</script></body></html>
